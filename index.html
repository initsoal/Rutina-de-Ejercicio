<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker de Entrenamiento - Ingrid Itzel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root { --pf-purple: #5c2c90; --pf-yellow: #ffd200; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; }
        .text-pf-purple { color: var(--pf-purple); }
        .bg-pf-purple { background-color: var(--pf-purple); }
        .bg-pf-yellow { background-color: var(--pf-yellow); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const exercises = [
            { day: "Lunes", name: "Prensa de Piernas", target: "Tren Inferior A", defaultWeight: "30-50 lbs" },
            { day: "Lunes", name: "Peso Muerto Rumano", target: "Tren Inferior A", defaultWeight: "10-15 lbs" },
            { day: "Lunes", name: "Sentadilla Goblet", target: "Tren Inferior A", defaultWeight: "10-15 lbs" },
            { day: "Miércoles", name: "Jalón al Pecho", target: "Tren Superior A", defaultWeight: "20-30 lbs" },
            { day: "Miércoles", name: "Empuje de Pecho", target: "Tren Superior A", defaultWeight: "15-25 lbs" },
            { day: "Viernes", name: "Extensiones de Pierna", target: "Tren Inferior B", defaultWeight: "15-20 lbs" },
            { day: "Viernes", name: "Curl de Pierna", target: "Tren Inferior B", defaultWeight: "15-20 lbs" },
            { day: "Sábado", name: "Aperturas de Pecho", target: "Tren Superior B", defaultWeight: "10-15 lbs" }
        ];

        function App() {
            const [unit, setUnit] = useState('lbs');
            const [logs, setLogs] = useState({});

            useEffect(() => {
                const saved = localStorage.getItem('ingridTracker');
                if (saved) setLogs(JSON.parse(saved));
            }, []);

            const saveLog = (exercise, weight) => {
                const newLogs = { ...logs };
                if (!newLogs[exercise]) newLogs[exercise] = [];
                newLogs[exercise].push({ date: new Date().toLocaleDateString(), weight, unit });
                setLogs(newLogs);
                localStorage.setItem('ingridTracker', JSON.stringify(newLogs));
                alert(`¡Peso de ${weight}${unit} registrado para ${exercise}!`);
            };

            return (
                <div className="max-w-5xl mx-auto p-4">
                    <header className="bg-pf-purple text-white p-6 rounded-t-lg shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <h1 className="text-3xl font-bold text-[#ffd200]">Tracker Planet Fitness</h1>
                            <p className="text-sm mt-1">Perfil: Ingrid Itzel | Mes 1: Pérdida de Peso</p>
                        </div>
                        <div className="bg-white/20 p-2 rounded flex items-center">
                            <label className="mr-2 font-bold">Unidad actual:</label>
                            <select className="text-black p-1 rounded font-bold" value={unit} onChange={(e)=>setUnit(e.target.value)}>
                                <option value="lbs">Libras (lbs)</option>
                                <option value="kg">Kilos (kg)</option>
                            </select>
                        </div>
                    </header>
                    
                    <div className="bg-white p-6 rounded-b-lg shadow-lg">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {exercises.map((ex, i) => (
                                <div key={i} className="border-2 border-gray-100 p-5 rounded-xl shadow-sm hover:shadow-md transition flex flex-col justify-between">
                                    <div>
                                        <div className="flex justify-between items-center mb-2">
                                            <span className="text-xs font-bold bg-pf-yellow text-pf-purple px-2 py-1 rounded uppercase">{ex.day}</span>
                                            <span className="text-xs text-gray-500">{ex.target}</span>
                                        </div>
                                        <h3 className="font-bold text-xl text-pf-purple mb-1">{ex.name}</h3>
                                        <p className="text-sm text-gray-600 mb-4">Sugerido: {ex.defaultWeight}</p>
                                    </div>
                                    <div className="mt-2 flex gap-2">
                                        <input 
                                            type="number" 
                                            id={`input-${i}`}
                                            className="border-2 border-gray-200 rounded p-2 w-full focus:border-pf-purple outline-none" 
                                            placeholder={`Peso en ${unit}`}
                                        />
                                        <button 
                                            onClick={() => {
                                                const input = document.getElementById(`input-${i}`);
                                                if(input.value) {
                                                    saveLog(ex.name, input.value);
                                                    input.value = '';
                                                }
                                            }}
                                            className="bg-pf-purple text-white px-4 py-2 rounded font-bold hover:bg-purple-900 transition"
                                        >
                                            Guardar
                                        </button>
                                    </div>
                                    <div className="mt-3 text-xs text-gray-400">
                                        {logs[ex.name] ? `Último registro: ${logs[ex.name][logs[ex.name].length-1].weight} ${logs[ex.name][logs[ex.name].length-1].unit}` : 'Sin registros aún'}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
